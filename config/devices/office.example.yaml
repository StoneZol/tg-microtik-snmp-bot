# Copy to office.yaml (or any name) and fill in real values.
# Every *.yaml / *.yml in this folder is loaded on startup
# (except *.example.yaml). Set enabled: false to park a checker
# without deleting the file (no SNMP, no env var checks).

id: office
name: "Office MikroTik"
enabled: false # true
host: 10.0.0.1
port: 161
community_env: SNMP_COMMUNITY_OFFICE

# Optional: shared secret for HTTP hooks from this router (see README)
# hook_secret_env: HOOK_SECRET_OFFICE

# Seconds between SNMP polls for THIS device
interval: 30

# Consecutive SNMP failures before "down" alert
fail_limit: 3

# IANA timezone for per-bot status_schedule
timezone: Europe/Moscow

# Who gets alerts / can talk to the bot for this device.
# token_env → secret in .env
# whitelist → Telegram user id and/or @username (omit = anyone who /start'd)
# status_schedule → optional full status dumps for THIS bot only (HH:MM)
# Users must press /start once so Telegram allows DMs; we store that in SQLite.
# Username is matched case-insensitively; if they rename, update whitelist or use id.
notify:
    - token_env: BOT_MAIN_TOKEN
      # whitelist:
      #   - 123456789
      #   - "@alice"
      #   - bob
      status_schedule:
          - "09:00"
          - "18:00"
    - token_env: BOT_OWNER_OFFICE_TOKEN
      whitelist:
          - 111222333
          - "@owner_nick"
      status_schedule:
          - "12:00"

    - token_env: BOT_SECONDARY_TOKEN
      # whitelist:
      #   - 123456789
    - token_env: BOT_SECONDARY_OWNER_TOKEN
      whitelist:
          - 111222333

# Built-in metrics thresholds (percent)
thresholds:
    cpu: 85
    memory: 85
    disk: 90

# ---------------------------------------------------------------------------
# OIDs — important: RouterOS terminal does NOT print OID numbers.
# On the router you only enable SNMP and confirm the metric exists.
# The numeric OID string (and storage INDEX) comes from MikroTik MIB /
# one snmpwalk FROM THE BOT HOST (or any PC that can reach the router).
#
# 1) In RouterOS terminal (Winbox → New Terminal / SSH):
#      /snmp
#      set enabled=yes
#      /snmp community
#      set [find default=yes] name=YOUR_COMMUNITY read-access=yes
#      /snmp print
#      /ip service print   (optional: make sure snmp is not blocked)
#
# 2) Same metrics without OID (sanity check on the router):
#      /system resource print
#      /system health print
#      /system identity print
#
# 3) Get real OID strings (run on Linux/WSL/bot host, NOT in RouterOS):
#      snmpwalk -v2c -c YOUR_COMMUNITY ROUTER_IP 1.3.6.1.2.1.25.2.3.1.3
#      snmpwalk -v2c -c YOUR_COMMUNITY ROUTER_IP 1.3.6.1.2.1.25.3.3.1.2
#      snmpwalk -v2c -c YOUR_COMMUNITY ROUTER_IP 1.3.6.1.4.1.14988
#    Indexes like 65536 / 131072 below are common on MikroTik but can differ —
#    take INDEX from the walk (name "main memory" / "system disk" etc.).
# ---------------------------------------------------------------------------
oids:
    # sysUpTime — always .0 on MIB-2. Router check: /system resource print (uptime)
    uptime: "1.3.6.1.2.1.1.3.0"

    # CPU % — usually ...25.3.3.1.2.1 (first processor). Router: /system resource print (cpu)
    # Confirm indexes: snmpwalk ... 1.3.6.1.2.1.25.3.3.1.2
    cpu: "1.3.6.1.2.1.25.3.3.1.2.1"

    # Memory / disk via hrStorageTable. Router: /system resource print (free-memory, total-memory)
    # Discover INDEX: snmpwalk ... 1.3.6.1.2.1.25.2.3.1.3
    # Then: ...1.5.<INDEX>=size  ...1.6.<INDEX>=used  ...1.4.<INDEX>=unit bytes
    mem_size: "1.3.6.1.2.1.25.2.3.1.5.65536"
    mem_used: "1.3.6.1.2.1.25.2.3.1.6.65536"
    mem_unit: "1.3.6.1.2.1.25.2.3.1.4.65536"
    disk_size: "1.3.6.1.2.1.25.2.3.1.5.131072"
    disk_used: "1.3.6.1.2.1.25.2.3.1.6.131072"
    disk_unit: "1.3.6.1.2.1.25.2.3.1.4.131072"

# Extra gauges (MikroTik enterprise MIB 1.3.6.1.4.1.14988)
# type: gauge (default) | percent
metrics:
    # Optional — omit or comment out if snmpget returns "No Such Object"
    # - id: temperature
